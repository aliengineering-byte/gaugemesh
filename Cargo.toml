[workspace]
members = ["crates/gaugemesh-core", "crates/gaugemesh"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/aliengineering-byte/gaugemesh"

[workspace.dependencies]
anyhow = "=1.0.99"
async-trait = "=0.1.89"
axum = { version = "=0.8.4", features = ["http2", "json", "macros"] }
base64 = "=0.22.1"
clap = { version = "=4.5.46", features = ["derive", "env"] }
futures-util = "=0.3.31"
hex = "=0.4.3"
hmac = "=0.12.1"
http = "=1.3.1"
indexmap = { version = "=2.11.0", features = ["serde"] }
proptest = "=1.7.0"
rand = "=0.9.2"
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
schemars = { version = "=1.0.4", features = ["derive", "url2", "uuid1"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tempfile = "=3.21.0"
thiserror = "=2.0.16"
tokio = { version = "=1.47.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
tower = { version = "=0.5.2", features = ["util"] }
tower-http = { version = "=0.6.11", features = ["cors", "limit", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "=0.1.24"
url = { version = "=2.5.7", features = ["serde"] }
uuid = { version = "=1.18.0", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
