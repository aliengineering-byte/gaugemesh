name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject prohibited introduced-history markers
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="$(git rev-list --max-parents=0 HEAD)"; fi
          pattern="$(printf '%s' 'Y28tYXV0aG9yZWQtYnk6LiooY29kZXh8Y2xhdWRlKXxnZW5lcmF0ZWQgYnkgKGNvZGV4fGFpKXxhaS1nZW5lcmF0ZWR8YWktYXNzaXN0ZWR8YXNzaXN0YW50QHxib3RAfHJlc2lsaXJlcGxheVwubG9jYWx8aW50ZXJuYWwgZXhlY3V0aW9uIGlkfGludGVybmFsIHByb21wdCByZWZlcmVuY2V8YzpcXHVzZXJzXFx8L21udC9jL3VzZXJzL3xcLmNvZGV4' | base64 -d)"
          ! git log "$base"..HEAD --format='%an%n%ae%n%B' | grep -Eai "$pattern"
          ! git diff "$base"..HEAD -- . | grep -Eai "$pattern"
      - name: Lint workflows with actionlint 1.7.7
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$archive"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - run: git diff --check

  test:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: 1.88.0
          - os: windows-latest
            toolchain: stable
          - os: windows-latest
            toolchain: 1.88.0
          - os: macos-14
            toolchain: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure runner-native Cargo target
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gaugemesh-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --doc --workspace
      - run: cargo test --locked -p gaugemesh-core config::tests::checked_in_schema_matches_the_typed_configuration
      - run: cargo run --locked -- demo
      - run: cargo run --locked -- route explain
      - run: cargo run --locked -- connect generic-mcp
      - run: cargo run --locked -- connect openai-compatible

  linux-measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure runner-native Cargo target
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gaugemesh-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --locked --release
      - name: Measure idle RSS and run bounded concurrent load
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/release/gaugemesh"
          log="$RUNNER_TEMP/gaugemesh-load.log"
          "$binary" serve --data-address 127.0.0.1:18121 --admin-address 127.0.0.1:18123 >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill -INT "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18123/healthz >/dev/null; then ready=1; break; fi
            sleep 0.05
          done
          test "$ready" -eq 1
          rss_kib=$(awk '/^VmRSS:/ {print $2}' "/proc/$pid/status")
          echo "idle_rss_kib=$rss_kib"
          test "$rss_kib" -lt 81920
          seq 1 512 | xargs -P32 -I{} curl -fsS -o /dev/null http://127.0.0.1:18121/v1/models
          cleanup
          trap - EXIT
          ! kill -0 "$pid" 2>/dev/null
      - name: Binary, startup and route benchmark
        shell: bash
        run: |
          set -euo pipefail
          size "$CARGO_TARGET_DIR/release/gaugemesh"
          test "$(stat -c%s "$CARGO_TARGET_DIR/release/gaugemesh")" -lt 52428800
          /usr/bin/time -v "$CARGO_TARGET_DIR/release/gaugemesh" demo
          cargo bench --workspace --bench route
