name: Package acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PACKAGE_VERSION: 0.2.1

jobs:
  archive:
    name: archive (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: gaugemesh
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: gaugemesh
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: gaugemesh.exe
          - os: macos-15
            target: aarch64-apple-darwin
            binary: gaugemesh
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: gaugemesh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Keep build output outside the checkout
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gaugemesh-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Build the native release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin gaugemesh
      - name: Verify the checked-in demo transcript
        run: >-
          python scripts/verify_readme.py
          --binary "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Execute the clean README configuration journey
        run: >-
          python scripts/readme_smoke.py
          --binary "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Package the exact source revision
        run: >-
          python scripts/package.py
          --binary "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/${{ matrix.binary }}"
          --target "${{ matrix.target }}"
          --version "${{ env.PACKAGE_VERSION }}"
          --source-sha "${{ env.SOURCE_SHA }}"
      - name: Extract and execute the archive
        run: >-
          python scripts/package_smoke.py
          --archive "dist/gaugemesh-v${{ env.PACKAGE_VERSION }}-${{ matrix.target }}.zip"
          --target "${{ matrix.target }}"
          --version "${{ env.PACKAGE_VERSION }}"
          --source-sha "${{ env.SOURCE_SHA }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  source-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: gaugemesh-v${{ env.PACKAGE_VERSION }}.spdx.json
          upload-artifact: false
      - name: Validate the SPDX document
        run: python -c "import json; d=json.load(open('gaugemesh-v${{ env.PACKAGE_VERSION }}.spdx.json', encoding='utf-8')); assert d['spdxVersion'].startswith('SPDX-2.')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-sbom
          path: gaugemesh-v${{ env.PACKAGE_VERSION }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  crates-io-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Keep crate build output outside the checkout
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gaugemesh-crates-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Validate registry metadata and the publication dependency order
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python - "$RUNNER_TEMP/metadata.json" <<'PY'
          import json
          import pathlib
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))
          packages = {package["name"]: package for package in value["packages"]}
          assert set(packages) == {"gaugemesh", "gaugemesh-core"}
          for name, package in packages.items():
              assert package["version"] == "0.2.1"
              assert package["license"] == "Apache-2.0"
              assert package["repository"] == "https://github.com/aliengineering-byte/gaugemesh"
              assert package["homepage"] == "https://github.com/aliengineering-byte/gaugemesh"
              assert package["documentation"] == f"https://docs.rs/{name}"
              assert package["rust_version"] == "1.88"
              assert package["readme"] and pathlib.Path(package["readme"]).name == "README.md"
              assert 1 <= len(package["keywords"]) <= 5
              assert package["categories"] == [
                  "command-line-utilities", "development-tools", "network-programming"
              ]
          dependency = next(
              dependency for dependency in packages["gaugemesh"]["dependencies"]
              if dependency["name"] == "gaugemesh-core"
          )
          assert dependency["req"] == "=0.2.1"
          assert dependency["source"] is None
          PY
      - name: Run crate formatting and the first-publish core dry run
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo publish --dry-run --locked -p gaugemesh-core
          # Cargo correctly refuses a gaugemesh publish dry run until its exact
          # gaugemesh-core dependency exists on crates.io. Inspect that candidate
          # below; the owner repeats its full dry run after publishing the core.
      - name: Inspect the exact core crate and dependent crate file set
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/crates-output"
          cargo package --locked -p gaugemesh-core
          cargo package --locked --list -p gaugemesh-core | tee "$RUNNER_TEMP/crates-output/gaugemesh-core-0.2.1.files.txt"
          cargo package --locked --list -p gaugemesh | tee "$RUNNER_TEMP/crates-output/gaugemesh-0.2.1.files.txt"
          cp "$CARGO_TARGET_DIR/package/gaugemesh-core-0.2.1.crate" "$RUNNER_TEMP/crates-output/"
          for package in "$RUNNER_TEMP/crates-output"/*.crate; do
            test "$(stat --format=%s "$package")" -le 10000000
            root="$(basename "$package" .crate)"
            tar -tzf "$package" > "$RUNNER_TEMP/$root.contents"
            grep -Fxq "$root/Cargo.toml" "$RUNNER_TEMP/$root.contents"
            grep -Fxq "$root/README.md" "$RUNNER_TEMP/$root.contents"
            if grep -Eq '(^|/)(\.git|target|\.env|\.venv|__pycache__|node_modules)(/|$)' "$RUNNER_TEMP/$root.contents"; then
              echo "Private or generated path entered $package" >&2
              exit 1
            fi
            tar -xOzf "$package" "$root/Cargo.toml" > "$RUNNER_TEMP/$root.Cargo.toml"
            grep -Eq '^license[[:space:]]*=[[:space:]]*"Apache-2.0"' "$RUNNER_TEMP/$root.Cargo.toml"
            python - "$RUNNER_TEMP/$root.Cargo.toml" <<'PY'
            import sys
            import tomllib

            value = tomllib.load(open(sys.argv[1], "rb"))
            scopes = [value]
            scopes.extend(value.get("target", {}).values())
            for scope in scopes:
                for section in ("dependencies", "dev-dependencies", "build-dependencies"):
                    for name, dependency in scope.get(section, {}).items():
                        if isinstance(dependency, dict) and "path" in dependency:
                            raise SystemExit(f"local path retained for dependency {name}")
            PY
          done
          grep -Fxq Cargo.toml "$RUNNER_TEMP/crates-output/gaugemesh-0.2.1.files.txt"
          grep -Fxq README.md "$RUNNER_TEMP/crates-output/gaugemesh-0.2.1.files.txt"
          if grep -Eq '(^|/)(\.git|target|\.env|\.venv|__pycache__|node_modules)(/|$)' "$RUNNER_TEMP/crates-output/gaugemesh-0.2.1.files.txt"; then
            echo "Private or generated path entered the gaugemesh package list" >&2
            exit 1
          fi
          source_bytes=$(find crates/gaugemesh -type f -printf '%s\n' | awk '{total += $1} END {print total + 0}')
          test "$source_bytes" -le 10000000
          (cd "$RUNNER_TEMP/crates-output" && sha256sum -- ./*.crate > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crates-io-0.2.1-core-candidate
          path: |
            ${{ runner.temp }}/crates-output/*.crate
            ${{ runner.temp }}/crates-output/*.txt
            ${{ runner.temp }}/crates-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  openai-sdk:
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-x86_64-unknown-linux-gnu
          path: package
      - name: Run the official OpenAI Python SDK 3.6.0 against GaugeMesh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gaugemesh-sdk"
          unzip -q package/*.zip -d "$RUNNER_TEMP/gaugemesh-sdk"
          binary="$RUNNER_TEMP/gaugemesh-sdk/gaugemesh"
          chmod +x "$binary"
          python -m venv "$RUNNER_TEMP/openai-sdk"
          "$RUNNER_TEMP/openai-sdk/bin/pip" install --disable-pip-version-check openai==3.6.0
          log="$RUNNER_TEMP/gaugemesh-openai-sdk.log"
          "$binary" serve --data-address 127.0.0.1:18141 --admin-address 127.0.0.1:18143 >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill -INT "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18143/healthz >/dev/null; then ready=1; break; fi
            sleep 0.05
          done
          test "$ready" -eq 1
          "$RUNNER_TEMP/openai-sdk/bin/python" scripts/openai_sdk_smoke.py --base-url http://127.0.0.1:18141/v1
          cleanup
          trap - EXIT
          if kill -0 "$pid" 2>/dev/null; then exit 1; fi
          if ss -ltn | grep -Eq ':(18141|18143)[[:space:]]'; then exit 1; fi

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the optional non-root container
        run: docker build --pull --tag gaugemesh:smoke .
      - run: docker run --rm gaugemesh:smoke --version
      - name: Run the no-key demo in the container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm gaugemesh:smoke demo --json > "$RUNNER_TEMP/container-demo.json"
          python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP'] + '/container-demo.json')); assert d['status']=='PASS' and d['ownedChildrenRemaining']==0 and d['ownedListenersRemaining']==0"
