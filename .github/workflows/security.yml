name: Security and provenance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: cargo audit --deny warnings
      - run: cargo deny check advisories bans licenses sources
      - name: Scan repository with gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --no-color

  resilireplay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure runner-native Cargo target
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gaugemesh-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --locked
      - name: Prime exact ResiliReplay CLI outside the bounded verifier
        run: npx -y resilireplay@0.7.0 --version
      - run: '"$CARGO_TARGET_DIR/debug/gaugemesh" verify --resilireplay'

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure runner-native fuzz paths
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gaugemesh-fuzz-target" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/fuzz-corpus/config" "$RUNNER_TEMP/fuzz-corpus/protocol_revision"
          mkdir -p "$RUNNER_TEMP/fuzz-artifacts/config" "$RUNNER_TEMP/fuzz-artifacts/protocol_revision"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-30
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-fuzz@0.13.2
      - run: cargo +nightly-2026-08-30 fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu config "$RUNNER_TEMP/fuzz-corpus/config" -- -max_total_time=15 -artifact_prefix="$RUNNER_TEMP/fuzz-artifacts/config/"
      - run: cargo +nightly-2026-08-30 fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu protocol_revision "$RUNNER_TEMP/fuzz-corpus/protocol_revision" -- -max_total_time=15 -artifact_prefix="$RUNNER_TEMP/fuzz-artifacts/protocol_revision/"
