name: Deep quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "43 5 8 * *"

permissions:
  contents: read

jobs:
  mutation-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Run focused safety-critical mutants in isolated scratch trees
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          cargo mutants --package gaugemesh-core --timeout 180 --build-timeout 300 --jobs 2
          --file crates/gaugemesh-core/src/invariant.rs
          --file crates/gaugemesh-core/src/translation.rs
          --file crates/gaugemesh-core/src/route.rs
          --file crates/gaugemesh-core/src/policy.rs
          --file crates/gaugemesh-core/src/capability.rs
          --file crates/gaugemesh-core/src/budget.rs
          --file crates/gaugemesh-core/src/causal.rs
          --file crates/gaugemesh-core/src/protocol.rs
          -- --lib

  mutation-broad:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-mutants@27.1.0
      - env:
          TMPDIR: ${{ runner.temp }}
        run: cargo mutants --package gaugemesh-core --timeout 180 --build-timeout 300 --jobs 2

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure runner-native Miri target
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gaugemesh-miri-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-30
          components: miri, rust-src
      - run: cargo +nightly-2026-08-30 miri test -p gaugemesh-core --lib digest::tests
      - run: cargo +nightly-2026-08-30 miri test -p gaugemesh-core --lib policy::tests
      - run: cargo +nightly-2026-08-30 miri test -p gaugemesh-core --lib causal::tests
      - run: cargo +nightly-2026-08-30 miri test -p gaugemesh-core --lib invariant::tests
      - run: cargo +nightly-2026-08-30 miri test -p gaugemesh-core --lib translation::tests

  address-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure runner-native sanitizer target
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gaugemesh-asan-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-30
          components: rust-src
      - run: cargo +nightly-2026-08-30 test -p gaugemesh-core -Zbuild-std --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      - run: cargo +nightly-2026-08-30 test -p gaugemesh --bin gaugemesh -Zbuild-std --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      - run: cargo +nightly-2026-08-30 test -p gaugemesh --test stdio_transport -Zbuild-std --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
