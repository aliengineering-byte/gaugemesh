name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected annotated release tag
        required: true
        type: string
      reverify_only:
        description: Reverify existing immutable release artifacts without rebuilding or uploading
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.created }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      image_digest: ${{ steps.release.outputs.image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - id: release
        name: Validate public, protected, annotated release state
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test '${{ github.event.repository.private }}' = 'false'
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_object_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          source_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          test -n "$tag_object_sha"
          test -n "$source_sha"
          test "$tag_object_sha" != "$source_sha"
          test "$source_sha" = "$(git rev-parse HEAD)"
          version="${RELEASE_TAG#v}"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "$version"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main
          python scripts/verify_repository_rules.py --repository "$GITHUB_REPOSITORY"
          created="$(git show -s --format=%cI "$source_sha")"
          image_digest=''
          if test '${{ inputs.reverify_only }}' = 'true'; then
            server="$RUNNER_TEMP/gaugemesh-${RELEASE_TAG}-server.json"
            curl --fail --location --retry 8 --retry-all-errors \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/gaugemesh-${RELEASE_TAG}-server.json" \
              --output "$server"
            identifier="$(jq -er '.packages[0].identifier' "$server")"
            expected_prefix="ghcr.io/${GITHUB_REPOSITORY}@"
            test "${identifier#"$expected_prefix"}" != "$identifier"
            image_digest="${identifier#"$expected_prefix"}"
            [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$(jq -r '.version' "$server")" = "$version"
          fi
          {
            echo "created=$created"
            echo "source_sha=$source_sha"
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"

  binaries:
    needs: validate
    if: ${{ !inputs.reverify_only }}
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: gaugemesh
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: gaugemesh
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: gaugemesh.exe
          - os: macos-15
            target: aarch64-apple-darwin
            binary: gaugemesh
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: gaugemesh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Keep build output outside the checkout
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gaugemesh-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --locked --release --target ${{ matrix.target }} --bin gaugemesh
      - run: >-
          python scripts/verify_readme.py
          --binary "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/${{ matrix.binary }}"
      - run: >-
          python scripts/readme_smoke.py
          --binary "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/${{ matrix.binary }}"
      - run: >-
          python scripts/package.py
          --binary "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/${{ matrix.binary }}"
          --target "${{ matrix.target }}"
          --version "${{ needs.validate.outputs.version }}"
          --source-sha "${{ needs.validate.outputs.source_sha }}"
      - run: >-
          python scripts/package_smoke.py
          --archive "dist/gaugemesh-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.zip"
          --target "${{ matrix.target }}"
          --version "${{ needs.validate.outputs.version }}"
          --source-sha "${{ needs.validate.outputs.source_sha }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  image-build:
    needs: validate
    if: ${{ !inputs.reverify_only }}
    name: image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.tag }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.created=${{ needs.validate.outputs.created }}
            org.opencontainers.image.description=Semantics-preserving routing for agents, MCP servers, and models.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=GaugeMesh
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            io.modelcontextprotocol.server.name=io.github.aliengineering-byte/gaugemesh
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-image-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.suffix }}
      - name: Execute the native image
        run: >-
          docker run --rm
          ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.tag }}-${{ matrix.suffix }}
          --version

  image:
    needs: [validate, image-build]
    if: ${{ !inputs.reverify_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        name: Publish and inspect the multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}"
          tag="${{ needs.validate.outputs.tag }}"
          docker buildx imagetools create \
            --tag "$image:$tag" \
            --tag "$image:${{ needs.validate.outputs.version }}" \
            "$image:$tag-amd64" \
            "$image:$tag-arm64"
          descriptor="$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest' <<<"$descriptor")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$image@$digest" --raw | \
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | unique | sort == ["amd64", "arm64"]'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify anonymous access to the public developer-preview image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          repository="${IMAGE#ghcr.io/}"
          token="$(curl --fail --silent --show-error \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" | \
            jq -er '.token')"
          curl --fail --silent --show-error --head \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/${repository}/manifests/${TAG}" | \
            grep -i '^docker-content-digest:'
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Execute both published image architectures
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}@${{ steps.manifest.outputs.digest }}"
          docker pull --platform linux/amd64 "$image"
          docker run --rm --platform linux/amd64 "$image" --version
          docker image rm "$image"
          docker pull --platform linux/arm64 "$image"
          docker run --rm --platform linux/arm64 "$image" --version

  publish:
    needs: [validate, binaries, image]
    if: ${{ !inputs.reverify_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/gaugemesh-${{ needs.validate.outputs.tag }}.spdx.json
          upload-artifact: false
      - name: Bind MCP Registry metadata to the immutable public image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq --arg identifier "ghcr.io/${GITHUB_REPOSITORY}@$IMAGE_DIGEST" \
            '.packages[0].identifier = $identifier' \
            server.json > "dist/gaugemesh-${{ needs.validate.outputs.tag }}-server.json"
      - run: python scripts/checksums.py
      - name: Verify generated checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.json
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: GaugeMesh ${{ needs.validate.outputs.version }} — Invariant Routing Developer Preview
          body_path: docs/releases/${{ needs.validate.outputs.tag }}.md
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/*

  public-install:
    needs: [validate, publish, image]
    if: >-
      ${{ always() &&
          needs.validate.result == 'success' &&
          (inputs.reverify_only ||
           (needs.publish.result == 'success' && needs.image.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest || needs.validate.outputs.image_digest }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Clone and download without repository credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c credential.helper= clone --branch "$RELEASE_TAG" --depth 1 \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/public-gaugemesh"
          mkdir -p "$RUNNER_TEMP/public-release"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          for file in \
            "gaugemesh-${RELEASE_TAG}-x86_64-unknown-linux-gnu.zip" \
            "gaugemesh-${RELEASE_TAG}.spdx.json" \
            "gaugemesh-${RELEASE_TAG}-server.json" \
            SHA256SUMS; do
            curl --fail --location --retry 8 --retry-all-errors \
              "$base/$file" --output "$RUNNER_TEMP/public-release/$file"
          done
          cd "$RUNNER_TEMP/public-release"
          gh attestation verify "gaugemesh-${RELEASE_TAG}-x86_64-unknown-linux-gnu.zip" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "gaugemesh-${RELEASE_TAG}.spdx.json" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "gaugemesh-${RELEASE_TAG}-server.json" --repo "$GITHUB_REPOSITORY"
          gh attestation verify SHA256SUMS --repo "$GITHUB_REPOSITORY"
          grep -E 'x86_64-unknown-linux-gnu|spdx|server.json' SHA256SUMS | sha256sum --check
          jq -e --arg digest "$IMAGE_DIGEST" --arg version "${RELEASE_TAG#v}" \
            '.name == "io.github.aliengineering-byte/gaugemesh" and
             .version == $version and
             .packages[0].registryType == "oci" and
             .packages[0].transport.type == "stdio" and
             .packages[0].packageArguments[0].value == "mcp-stdio" and
             .packages[0].identifier == ("ghcr.io/aliengineering-byte/gaugemesh@" + $digest)' \
            "gaugemesh-${RELEASE_TAG}-server.json"
          python "$RUNNER_TEMP/public-gaugemesh/scripts/package_smoke.py" \
            --archive "gaugemesh-${RELEASE_TAG}-x86_64-unknown-linux-gnu.zip" \
            --target x86_64-unknown-linux-gnu \
            --version "${RELEASE_TAG#v}" \
            --source-sha "${{ needs.validate.outputs.source_sha }}"
          unzip -q "gaugemesh-${RELEASE_TAG}-x86_64-unknown-linux-gnu.zip" -d install
          chmod +x install/gaugemesh
      - name: Exercise external Tasks and Runs from the actual downloaded public binary
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/public-release/install/gaugemesh"
          source="$RUNNER_TEMP/public-gaugemesh"
          python "$source/examples/public_tasks/consumer.py" --binary "$binary" --output "$RUNNER_TEMP/public-external-tasks" --require-late-recovery
          python "$source/examples/public_tasks/run_consumer.py" --binary "$binary" --output "$RUNNER_TEMP/public-external-runs"
          node "$source/examples/public_tasks/second_consumer.mjs" "$binary" "$RUNNER_TEMP/public-external-javascript"
          python -m unittest discover -s "$source/examples/concrete_review" -p 'test_*.py' -v
          python "$source/examples/concrete_review/qualify.py" --binary "$binary" --output "$RUNNER_TEMP/public-external-concrete"
      - name: Pull the public GHCR image without credentials
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}@$IMAGE_DIGEST"
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' "$image")" = \
            'io.github.aliengineering-byte/gaugemesh'
          docker run --rm --platform linux/amd64 "$image" --version
      - name: Exercise the public image's stdio MCP lifecycle
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}@$IMAGE_DIGEST"
          # Keep image transfer outside the protocol client's bounded response timer.
          docker pull --platform linux/amd64 "$image"
          python "$RUNNER_TEMP/public-gaugemesh/scripts/mcp_stdio_smoke.py" \
            -- docker run --rm -i --platform linux/amd64 "$image" mcp-stdio
          docker image rm "$image"
      - name: Execute the public arm64 image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}@$IMAGE_DIGEST"
          docker pull --platform linux/arm64 "$image"
          docker run --rm --platform linux/arm64 "$image" --version
      - name: Re-run public OpenAI SDK and MCP client paths
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/public-release/install/gaugemesh"
          source="$RUNNER_TEMP/public-gaugemesh"
          python -m venv "$RUNNER_TEMP/public-openai-sdk"
          "$RUNNER_TEMP/public-openai-sdk/bin/pip" install --disable-pip-version-check openai==3.6.0
          server_pid=''
          cleanup() {
            if test -n "$server_pid"; then
              kill -INT "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          run_server() {
            if test "$1" = 1; then
              GAUGEMESH_CONFORMANCE_FIXTURE=1 "$binary" serve \
                --data-address 127.0.0.1:18151 --admin-address 127.0.0.1:18153 \
                >"$RUNNER_TEMP/public-server.log" 2>&1 &
            else
              "$binary" serve \
                --data-address 127.0.0.1:18151 --admin-address 127.0.0.1:18153 \
                >"$RUNNER_TEMP/public-server.log" 2>&1 &
            fi
            server_pid=$!
            ready=0
            for _ in $(seq 1 100); do
              if curl -fsS http://127.0.0.1:18153/healthz >/dev/null; then ready=1; break; fi
              sleep 0.05
            done
            test "$ready" -eq 1
          }
          stop_server() {
            kill -INT "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if kill -0 "$server_pid" 2>/dev/null; then exit 1; fi
            server_pid=''
          }
          run_server 0
          "$RUNNER_TEMP/public-openai-sdk/bin/python" "$source/scripts/openai_sdk_smoke.py" \
            --base-url http://127.0.0.1:18151/v1
          stop_server
          for revision in 2025-11-25 2026-07-28; do
            run_server 1
            npx -y @modelcontextprotocol/conformance@0.2.0-alpha.11 server \
              --url http://127.0.0.1:18151/mcp \
              --requirements "$revision" \
              --output-dir "$RUNNER_TEMP/public-conformance-$revision"
            stop_server
          done
          "$binary" verify --resilireplay | tee "$RUNNER_TEMP/public-resilireplay.log"
          if ss -ltn | grep -Eq ':(18151|18153)[[:space:]]'; then exit 1; fi
          trap - EXIT
      - name: Verify the published Pages surface
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/public-page.html"
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors \
            https://aliengineering-byte.github.io/gaugemesh/ --output "$page"
          grep -Fq 'GaugeMesh developer preview' "$page"
          grep -Fq 'not a production-readiness' "$page"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: public-install-verification
          path: |
            ${{ runner.temp }}/public-server.log
            ${{ runner.temp }}/public-resilireplay.log
            ${{ runner.temp }}/public-conformance-*
            ${{ runner.temp }}/public-external-*
          if-no-files-found: warn
          retention-days: 30

  publish-mcp-registry:
    needs: [validate, public-install, image]
    if: >-
      ${{ always() &&
          needs.validate.result == 'success' &&
          needs.public-install.result == 'success' &&
          (inputs.reverify_only || needs.image.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Install checksum-pinned official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz'
          curl --fail --location --retry 5 "$url" --output "$RUNNER_TEMP/mcp-publisher.tgz"
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  '"$RUNNER_TEMP/mcp-publisher.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tgz" -C "$RUNNER_TEMP" mcp-publisher
          chmod +x "$RUNNER_TEMP/mcp-publisher"
      - name: Validate and publish immutable OCI metadata
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest || needs.validate.outputs.image_digest }}
          MCP_REGISTRY: https://registry.modelcontextprotocol.io
        run: |
          set -euo pipefail
          jq --arg identifier "ghcr.io/${GITHUB_REPOSITORY}@$IMAGE_DIGEST" \
            '.packages[0].identifier = $identifier' server.json > "$RUNNER_TEMP/server.json"
          cd "$RUNNER_TEMP"
          ./mcp-publisher validate
          query="$MCP_REGISTRY/v0.1/servers?search=io.github.aliengineering-byte%2Fgaugemesh&version=${{ needs.validate.outputs.version }}"
          if ! curl --fail --silent --show-error "$query" | jq -e --arg image "ghcr.io/${GITHUB_REPOSITORY}@$IMAGE_DIGEST" \
            '.servers[]? | select(.server.name == "io.github.aliengineering-byte/gaugemesh" and .server.version == "${{ needs.validate.outputs.version }}" and .server.packages[0].identifier == $image)' >/dev/null; then
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish
          fi
          for delay in 2 4 8 16 30; do
            if curl --fail --silent --show-error "$query" | jq -e --arg image "ghcr.io/${GITHUB_REPOSITORY}@$IMAGE_DIGEST" \
              '.servers[]? | select(.server.name == "io.github.aliengineering-byte/gaugemesh" and .server.version == "${{ needs.validate.outputs.version }}" and .server.packages[0].identifier == $image and .server.packages[0].transport.type == "stdio" and .server.packages[0].packageArguments[0].value == "mcp-stdio")' >/dev/null; then
              exit 0
            fi
            sleep "$delay"
          done
          echo 'Exact GaugeMesh Registry metadata did not become public' >&2
          exit 1
